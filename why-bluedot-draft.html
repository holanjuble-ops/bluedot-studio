<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:#0A0E1A;color:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0;word-break:keep-all;text-wrap:pretty}
a{color:var(--bd-blue-300)}a:hover{opacity:.85}
.draft-label{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(10,14,26,.86);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.draft-label b{color:#fff;font-family:var(--font-sans);letter-spacing:-.01em;text-transform:none;font-size:14px;font-weight:700}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease-out),transform .6s var(--ease-out)}
.reveal--in{opacity:1;transform:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(21,71,255,.5)}60%{box-shadow:0 0 0 8px rgba(21,71,255,0)}}
@keyframes sheen{0%{opacity:.35}50%{opacity:.9}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
